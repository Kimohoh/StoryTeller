<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <rect width="400" height="300" fill="#1B1917"/>
  <!-- 화면을 가르는 빛의 칼날 하나. 8장 중 광량 최소 -->
  <rect x="212" y="0" width="6" height="300" fill="#E5BE72"/>
  <rect x="218" y="0" width="182" height="300" fill="#C4903D" opacity=".22"/>
  <!-- 밝은 쪽, 얼굴 없는 세 사람. 여기서 처음 형태를 얻는다 -->
  <g fill="#100E0C">
    <circle cx="256" cy="118" r="17"/><path d="M232 272 q0-88 24-88 q24 0 24 88 z"/>
    <circle cx="312" cy="110" r="18"/><path d="M286 272 q0-92 26-92 q26 0 26 92 z"/>
    <circle cx="366" cy="120" r="16"/><path d="M344 272 q0-86 22-86 q22 0 22 86 z"/>
  </g>
  <!-- 어두운 쪽, 혼자 -->
  <path d="M28 254 q76-26 148 0 z" fill="#151311"/>
  <g stroke="#151311" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M62 246 q-12 10-24 12"/><path d="M150 244 q12 10 26 12"/>
  </g>
  <!-- 액자: 어둠 속에서 거의 보이지 않는다 -->
  <rect x="24" y="60" width="44" height="36" fill="none" stroke="#221E1A" stroke-width="2"/>
</svg>
