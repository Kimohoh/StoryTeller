<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <rect width="400" height="300" fill="#1B1917"/>
  <!-- 열린 문. 문 너머는 비워둔다 — 판단하는 건 독자다 -->
  <rect x="286" y="18" width="96" height="250" fill="#E5BE72"/>
  <rect x="286" y="18" width="96" height="250" fill="none" stroke="#5C4C33" stroke-width="3"/>
  <rect x="248" y="18" width="38" height="250" fill="#2A241E"/>
  <!-- 8장 중 광량 최대: 바닥을 가로지르는 넓은 빛의 쐐기 -->
  <path d="M286 60 L286 268 L34 268 L120 148 Z" fill="#C4903D" opacity=".9"/>
  <path d="M286 96 L286 250 L96 250 L166 166 Z" fill="#E5BE72" opacity=".75"/>
  <!-- 빛 웅덩이 안, 여기서만 가느다란 다리가 분명히 보인다 -->
  <path d="M132 244 q76-30 148 0 z" fill="#1B1917"/>
  <g stroke="#1B1917" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M158 234 q-14 12-30 14"/><path d="M186 226 q-12 16-30 22"/>
    <path d="M222 224 q10 16 28 20"/><path d="M252 230 q12 10 28 12"/>
  </g>
  <!-- 액자: 청동 테두리가 빛을 조금 받는다 -->
  <rect x="30" y="72" width="46" height="38" fill="#241F1A" stroke="#C4903D" stroke-width="2.5"/>
</svg>
