<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <rect width="400" height="300" fill="#1B1917"/>
  <!-- 시리즈에서 유일한 실외 광원. 1페이지의 4분할 창을 여기서 회수한다 —
       그때는 빗줄기였고 여기서는 햇빛이 통과한다. -->
  <rect x="86" y="34" width="286" height="150" fill="#E5BE72"/>
  <rect x="86" y="130" width="286" height="54" fill="#C4903D" opacity=".45"/>
  <path d="M86 128 q70-14 142-4 q74 10 144-2 l0 12 q-72 12-146 2 q-70-10-140 4 z" fill="#5C4C33" opacity=".35"/>
  <g stroke="#2A241E" stroke-width="7">
    <line x1="229" y1="34" x2="229" y2="184"/>
    <line x1="86" y1="109" x2="372" y2="109"/>
  </g>
  <rect x="86" y="34" width="286" height="150" fill="none" stroke="#2A241E" stroke-width="9"/>
  <!-- 전차 천장의 가로봉과 가죽 손잡이 -->
  <line x1="0" y1="26" x2="400" y2="26" stroke="#3A342C" stroke-width="4"/>
  <g fill="none" stroke="#5C4C33" stroke-width="3">
    <path d="M126 26 v16 a9 9 0 0 0 18 0 v-16"/>
    <path d="M258 26 v20 a9 9 0 0 0 18 0 v-20"/>
    <path d="M330 26 v13 a9 9 0 0 0 18 0 v-13"/>
  </g>
  <!-- 좌석 -->
  <rect x="0" y="228" width="400" height="16" fill="#2A241E"/>
  <rect x="0" y="244" width="400" height="56" fill="#241F1A"/>
  <!-- 부모 둘. 8페이지의 검은 실루엣과 달리 빛을 받아 밝은 쪽이다. 얼굴은 없다. -->
  <g fill="#4A3B27">
    <circle cx="44" cy="150" r="19"/><path d="M14 228 q0-56 30-56 q30 0 30 56 z"/>
    <circle cx="104" cy="156" r="18"/><path d="M76 228 q0-52 28-52 q28 0 28 52 z"/>
  </g>
  <!-- 그레테. 먼저 일어나 몸을 편다. 시리즈에서 유일하게 수직으로 뻗은 형체다. -->
  <g fill="#5C4C33">
    <circle cx="300" cy="96" r="17"/>
    <path d="M280 228 q-2-98 20-100 q22 2 20 100 z"/>
    <path d="M284 132 q-16-22-12-40" stroke="#5C4C33" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M316 132 q16-22 12-40" stroke="#5C4C33" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
