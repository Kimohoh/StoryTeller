<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <rect width="400" height="300" fill="#1B1917"/>
  <!-- 닫힌 문이 화면을 지배한다 -->
  <rect x="96" y="14" width="212" height="258" fill="#2A241E"/>
  <rect x="106" y="24" width="192" height="238" fill="#241F1A"/>
  <g fill="none" stroke="#3A342C" stroke-width="2.5">
    <rect x="122" y="40" width="72" height="86"/><rect x="210" y="40" width="72" height="86"/>
    <rect x="122" y="146" width="72" height="86"/><rect x="210" y="146" width="72" height="86"/>
  </g>
  <!-- 놋쇠 열쇠구멍: 점 하나의 빛 -->
  <circle cx="290" cy="152" r="4.5" fill="#C4903D"/>
  <path d="M287 154 h6 l-1.6 9 h-2.8 z" fill="#C4903D"/>
  <!-- 문 밑 빛의 띠, 그림자 셋이 끊는다 -->
  <rect x="106" y="262" width="192" height="9" fill="#E5BE72"/>
  <rect x="140" y="262" width="22" height="9" fill="#1B1917"/>
  <rect x="184" y="262" width="22" height="9" fill="#1B1917"/>
  <rect x="228" y="262" width="22" height="9" fill="#1B1917"/>
  <rect x="106" y="271" width="192" height="14" fill="#C4903D" opacity=".1"/>
  <!-- 벽의 액자 -->
  <rect x="26" y="70" width="44" height="36" fill="none" stroke="#5C4C33" stroke-width="2.5" opacity=".6"/>
  <!-- 문에서 먼 오른쪽 어둠 속, 낮고 긴 덩어리 -->
  <path d="M320 258 q34-14 64 0 z" fill="#141210"/>
  <g stroke="#141210" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M336 250 q-4-16 3-24"/><path d="M360 248 q3-17 12-22"/>
  </g>
</svg>
