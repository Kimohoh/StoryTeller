# Fly.io 배포 설정.
#
# 서버 하나 + 볼륨 하나. SQLite 파일이 볼륨 위에 있으므로 머신은 한 대만 둔다 —
# 두 대가 같은 파일을 쓰면 깨진다. 이 앱의 쓰기 트래픽은 완독자의 답 여덟 줄뿐이라
# 한 대로 한참 간다.

app = "storyteller"
# 도쿄. 한국에서 가장 가까운 축에 속한다 — 더 가까운 리전이 있으면 바꿔도 된다.
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  STORYTELLER_DB = "/data/storyteller.sqlite"

[[mounts]]
  source = "storyteller_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # 볼륨이 붙은 머신은 자동으로 멈추게 두지 않는다. 첫 요청이 느려지고,
  # 읽는 도중 잠들면 답이 안 올라간다.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
